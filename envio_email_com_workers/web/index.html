<html>
  <head>
    <meta charset="utf-8">
    <title>Envio de Email com Workers</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f9f9f9;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      form {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 400px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
      }
      input, textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(90deg, #007BFF, #FF69B4);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s ease;
      }
      button:hover {
        background: linear-gradient(90deg, #0056b3, #ff4081);
      }
    </style>
  </head>
  <body>
    <form action="http://localhost/api" method="POST">
      <h1>Email Sender</h1>
      <div>
        <label for="assunto">Assunto</label>
        <input type="text" name="assunto" placeholder="Digite o assunto">
      </div>
      <div>
        <label for="mensagem">Mensagem</label>
        <textarea name="mensagem" cols="50" rows="6" placeholder="Digite sua mensagem"></textarea>
      </div>
      <div>
        <button>Enviar!</button>  
      </div>
    </form>
  </body>
</html>
